[project]
name = "twmcp"
version = "0.1.0"
description = "Taiwan utilities + open data MCP server — open-source, local, no token. Drop-in alternative to hub.twinkleai.tw."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "iml1s" }]
keywords = ["taiwan", "mcp", "opendata", "claude-code", "twtools", "twmcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.0",
    "typer>=0.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Taiwan-specific
    "python-stdnum>=2.2",
    # Generic CJK
    "lunar-python>=1.4,<2",
    "cn2an>=0.5,<1",
    "opencc-python-reimplemented>=0.1.7,<0.2",
    "pypinyin>=0.55,<1",
    "rapidfuzz>=3,<4",
    # Date/Time/Humanize
    "holidays>=0.96,<1",
    "Babel>=2,<3",
    "humanize>=4,<5",
    "python-dateutil>=2.9",
    # Phone / Numbers
    "phonenumbers>=9,<10",
    # PDF
    "PyMuPDF>=1.26,<2",
    "pdfplumber>=0.11,<1",
    "pypdf>=6,<7",
    # Web extraction
    "trafilatura>=2,<3",
    "readability-lxml>=0.8,<1",
    # IO / Parsing
    "requests>=2.32",
    "lxml>=5,<6",
    "pandas>=2,<4",
    # Cross-platform cache/config paths (per Gemini 3.1 Pro best practice #6)
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4",
]

[project.scripts]
twmcp = "twmcp.cli:app"

[project.urls]
Homepage = "https://github.com/iml1s/twmcp"
Repository = "https://github.com/iml1s/twmcp"
Issues = "https://github.com/iml1s/twmcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twmcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"
