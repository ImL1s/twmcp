name: Daily Data Refresh

on:
  schedule:
    # 每日台灣時間 04:00 (UTC 20:00 前一日)
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Refresh public data sources
        run: |
          python scripts/sync_holidays.py
          # TODO(v0.5): python scripts/sync_pcc.py --since yesterday
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/twmcp/data/
          git diff --staged --quiet || \
            git commit -m "chore(data): daily refresh $(date -u +%Y-%m-%d)"
          git push
